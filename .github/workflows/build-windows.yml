name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx @tauri-apps/cli build
