name: Linux Build & Verification Pipeline

# NOTE: This workflow executes in a headless CI environment (Ubuntu 24.04).
# It validates compilation, packaging, unit tests, and CLI/systemd scripts.
# It does NOT verify live desktop GUI rendering. Graphical GUI acceptance
# remains explicitly BLOCKED pending execution in an interactive desktop session.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  linux-pipeline:
    name: Ubuntu 24.04 x86_64 Build & Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies from Lockfile
        run: npm ci

      - name: Run Frontend TypeScript Check
        run: npx tsc -b

      - name: Run Rust Checks for Linux Target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Run Backend Unit Tests for Linux Target
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Disposable Linux Integration Lab
        run: |
          chmod +x tests/linux-lab/run-lab.sh tests/linux-lab/*/*.sh
          ./tests/linux-lab/run-lab.sh

      - name: Build Tauri Desktop Application for Linux
        run: npm run tauri build

      - name: Archive Linux Build Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-outputs
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/apptrace
            tests/linux-lab/results/
