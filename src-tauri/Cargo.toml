[package]
name = "apptrace"
version = "0.1.0"
default-run = "apptrace"
description = "AppTrace Desktop Observability"
authors = ["AppTrace Team"]
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "apptrace"
path = "src/main.rs"

[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"

[lib]
name = "app_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
sysinfo = "0.33"
notify = "8.0"
netstat2 = "0.10"
parking_lot = "0.12"
crossbeam-channel = "0.5"
uuid = { version = "1.15", features = ["v7", "v4", "serde"] }
dirs = "6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Services",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
